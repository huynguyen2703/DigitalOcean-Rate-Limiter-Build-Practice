name: rate-limiter-app
region: sfo
services:
  - name: api
    github:
      repo: huynguyen2703/DigitalOcean-Rate-Limiter-Build-Practice
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: "production"